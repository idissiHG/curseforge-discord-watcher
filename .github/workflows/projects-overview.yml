name: CurseForge Project Overview

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curseforge-project-overview
  cancel-in-progress: false

jobs:
  update-project-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Discord project overview
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          DISCORD_PROJECTS_WEBHOOK_URL: ${{ secrets.DISCORD_PROJECTS_WEBHOOK_URL }}
        run: python projects_overview.py

      - name: Save overview state
        shell: bash
        run: |
          if git diff --quiet -- projects_overview_state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects_overview_state.json
          git commit -m "chore: update project overview state"
          git push
